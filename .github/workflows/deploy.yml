name: Deploy Nodejs applition on AWS EC2 instance

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${ { secrets.SSH_HOST } }
          username: ${ { secrets.SSH_USERNAME } }
          key: ${ { secrets.SSH_PRIVATE_KEY } }
          secret: |
          cd /home/ubuntu/Projects_deploy/github-actions-deploy
          git pull origin main
          docker-compose down
          docker-compose up -d --build

